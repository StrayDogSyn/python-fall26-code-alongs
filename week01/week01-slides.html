<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intro to Python, Week 1: Learn the Controls</title>
<!-- Built by resources/slides/build.py from engine.html + a weekNN.js content file. Edit those, then rebuild. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #121212;
  --text: #f0f0f0;
  --muted: #a3a3a3;
  --yellow: #fcd34d;   /* working folder, edits */
  --blue: #60a5fa;     /* steps, staging */
  --green: #34d399;    /* success, committed */
  --purple: #c084fc;   /* GitHub, upstream */
  --red: #f87171;      /* warnings */
  --card: #1e1e1e;
  --code-bg: #2a2a2a;
  --border: #404040;
  --on-accent: #111111;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Fira Code', ui-monospace, Consolas, 'Courier New', monospace;
  color-scheme: dark;
}
html[data-theme="light"] {
  --bg: #f9fafb;
  --text: #111827;
  --muted: #4b5563;
  --yellow: #a16207;
  --blue: #1d4ed8;
  --green: #047857;
  --purple: #7e22ce;
  --red: #b91c1c;
  --card: #ffffff;
  --code-bg: #eef0f3;
  --border: #d1d5db;
  --on-accent: #ffffff;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: clamp(16px, 1.1vw + 0.55rem, 24px);
  line-height: 1.5;
  overflow: hidden;
  transition: background-color .25s, color .25s;
}
a { color: var(--blue); }
button, summary { font: inherit; }

/* ---------- Top bar and nav ---------- */
#topbar {
  position: fixed; inset: 0 0 auto 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center; gap: .5rem;
  padding: .6rem max(16px, 2vw); pointer-events: none; flex-wrap: wrap;
  background: linear-gradient(var(--bg) 60%, transparent);
}
#topbar .group { display: flex; gap: .5rem; pointer-events: auto; flex-wrap: wrap; }
.btn {
  background: var(--card); color: var(--text); border: 1px solid var(--border);
  padding: .35rem .8rem; border-radius: 6px; cursor: pointer; font-size: .72rem; font-weight: 600;
}
.btn.link { text-decoration: none; display: inline-flex; align-items: center; }
.btn:hover { border-color: var(--blue); }
.btn:focus-visible, summary:focus-visible, .chip:focus-visible, .draggable:focus-visible, .dropzone:focus-visible, input:focus-visible {
  outline: 3px solid var(--yellow); outline-offset: 2px;
}
.btn.primary { background: var(--blue); color: var(--on-accent); border-color: var(--blue); }
#deck-title { font-size: .68rem; color: var(--muted); font-weight: 600; pointer-events: none; }
#navbtns { position: fixed; left: max(16px, 2vw); bottom: 1rem; z-index: 100; display: flex; gap: .5rem; }
#counter { position: fixed; right: max(16px, 2vw); bottom: 1rem; z-index: 100; font-size: .7rem; color: var(--muted); }
#progress { position: fixed; left: 0; right: 0; bottom: 0; height: 6px; background: var(--card); z-index: 100; }
#progress > div { height: 100%; width: 0; background: var(--blue); transition: width .3s; }

/* ---------- Slides ---------- */
#deck { position: fixed; inset: 0; }
.slide {
  position: absolute; inset: 0; display: none; overflow-y: auto;
  padding: 4.6rem max(16px, 6vw) 4.6rem;
}
.slide.active { display: block; animation: fade .3s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.slide-inner { max-width: 1240px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; justify-content: center; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(15rem, 20rem); gap: 2rem; align-items: start; }
.layout.solo { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }

h1 { font-size: 2.6em; line-height: 1.1; color: var(--blue); margin-bottom: .4em; font-weight: 800; }
h2 { font-size: 1.75em; line-height: 1.15; margin-bottom: .55em; font-weight: 800; }
h3 { font-size: 1.15em; color: var(--yellow); margin: .9em 0 .4em; font-weight: 800; }
p, ul, ol { margin-bottom: .8em; }
ul, ol { padding-left: 1.4em; }
li { margin-bottom: .3em; }
.kicker { text-transform: uppercase; letter-spacing: .12em; font-size: .7em; color: var(--muted); font-weight: 600; margin-bottom: .4em; }
.lead { font-size: 1.1em; }
.muted { color: var(--muted); }
.small { font-size: .82em; }
.y { color: var(--yellow); font-weight: 700; } .b { color: var(--blue); font-weight: 700; }
.g { color: var(--green); font-weight: 700; } .p { color: var(--purple); font-weight: 700; } .r { color: var(--red); font-weight: 700; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1.2rem; }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.2rem; }
.panel h3:first-child { margin-top: 0; }
kbd { font-family: var(--mono); font-size: .8em; border: 1px solid var(--border); border-bottom-width: 3px; border-radius: 5px; padding: 0 .35em; background: var(--code-bg); }

code { font-family: var(--mono); background: var(--code-bg); padding: .1em .35em; border-radius: 4px; font-size: .86em; }
pre {
  position: relative; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: .8rem 1rem; margin-bottom: .9em; overflow-x: auto; font-family: var(--mono); font-size: .76em; line-height: 1.55;
}
pre code { background: none; padding: 0; font-size: 1em; }
pre.cmd { padding-right: 5.2rem; border-left: 4px solid var(--blue); }
pre.out { border-left: 4px solid var(--green); color: var(--muted); }
pre.out::before { content: "output"; display: block; font-family: var(--font); font-size: .75em; text-transform: uppercase; letter-spacing: .1em; color: var(--green); margin-bottom: .3em; }
.cmt { color: var(--muted); }
.copy { position: absolute; top: .45rem; right: .45rem; font-size: .7rem; padding: .2rem .55rem; }

.tbl-wrap { overflow-x: auto; margin-bottom: .9em; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .82em; }
.tbl th, .tbl td { text-align: left; padding: .45em .7em; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl th { color: var(--blue); font-weight: 700; }
.tbl code { white-space: nowrap; }
.badge { display: inline-block; font-size: .68em; font-weight: 700; padding: .05em .45em; border-radius: 4px; border: 1px solid var(--yellow); color: var(--yellow); margin-left: .35em; vertical-align: middle; white-space: nowrap; }

.callout { border-radius: 8px; padding: .8rem 1rem; margin: .8em 0; border: 1px solid; }
.callout strong:first-child { display: block; margin-bottom: .2em; }
.callout.warn { border-color: var(--red); background: color-mix(in srgb, var(--red) 12%, transparent); }
.callout.tip { border-color: var(--green); background: color-mix(in srgb, var(--green) 10%, transparent); }
.callout.note { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 10%, transparent); }
.callout.gh { border-color: var(--purple); background: color-mix(in srgb, var(--purple) 10%, transparent); }
.joke { border-left: 4px solid var(--purple); padding: .5rem 1rem; margin-top: 1em; font-size: .85em; color: var(--muted); }

details.reveal { margin: .8em 0; border: 1px dashed var(--blue); border-radius: 8px; padding: .6rem .9rem; }
details.reveal > summary { cursor: pointer; font-weight: 700; color: var(--blue); }
details.reveal > summary::marker { content: "🤔 "; }
details.reveal[open] > summary::marker { content: "💡 "; }
details.reveal > div { margin-top: .6em; }

/* OS-specific text: hidden by default, shown for the active OS */
.os-win, .os-mac { display: none; }
html[data-os="windows"] .os-win, html[data-os="mac"] .os-mac { display: inline; }
html[data-os="windows"] div.os-win, html[data-os="mac"] div.os-mac { display: block; }

/* ---------- Companion cards ---------- */
.companions { display: flex; flex-direction: column; gap: 1rem; }
.companions { font-size: .82em; }
.companion { background: var(--card); border: 1px solid var(--border); border-left: 6px solid var(--yellow); border-radius: 0 10px 10px 0; padding: .7rem .9rem; }
.companion .tag { font-size: .62em; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.companion .term { font-size: 1.2em; font-weight: 800; color: var(--yellow); line-height: 1.2; margin: .1em 0; }
.companion .say { font-family: var(--mono); font-size: .72em; color: var(--muted); }
.companion .meaning { margin: .35em 0; font-size: .95em; }
.companion .origin { font-size: .8em; color: var(--muted); margin-bottom: .35em; }
.companion .usage { font-size: .8em; font-style: italic; color: var(--muted); border-top: 1px solid var(--border); padding-top: .35em; }

/* ---------- Drawers ---------- */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); z-index: 200;
  background: var(--card); border-left: 1px solid var(--border); padding: 1.4rem 1.4rem 3rem; overflow-y: auto;
  transform: translateX(100%); visibility: hidden; transition: transform .3s ease, visibility 0s linear .3s;
  box-shadow: -6px 0 18px rgba(0,0,0,.35); font-size: .8em;
}
.drawer.open { transform: translateX(0); visibility: visible; transition: transform .3s ease; }
.drawer h2 { font-size: 1.4em; padding-right: 3rem; border-bottom: 1px solid var(--border); padding-bottom: .4em; }
.drawer .close { position: absolute; top: 1rem; right: 1rem; }
.note-row { margin-bottom: 1em; }
.note-row b { display: block; color: var(--blue); font-size: .8em; text-transform: uppercase; letter-spacing: .08em; }
.gloss { padding: .6em 0; border-bottom: 1px solid var(--border); }
.gloss .gterm { font-weight: 800; color: var(--yellow); }
.gloss.locked { opacity: .45; }
.gloss.locked .gdef { filter: blur(4px); user-select: none; }
.gloss .lock { font-size: .75em; color: var(--muted); }
#gloss-count { color: var(--muted); margin-bottom: .6em; }

/* ---------- Overview ---------- */
body.overview #deck { position: fixed; inset: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; padding: 4.5rem 1.5rem 2rem; align-content: start; }
body.overview .slide { position: relative; inset: auto; display: block; height: 170px; overflow: hidden; padding: .8rem; font-size: 7px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; background: var(--bg); }
body.overview .slide.active { border-color: var(--blue); }
body.overview .slide .slide-inner { justify-content: flex-start; }
body.overview .slide::after { content: attr(data-num) ". " attr(aria-label); position: absolute; left: 0; right: 0; bottom: 0; padding: .3rem .5rem; font-size: 12px; font-weight: 700; background: var(--card); border-top: 1px solid var(--border); }
body.overview #navbtns, body.overview #counter, body.overview #progress { display: none; }

/* ---------- Quiz ---------- */
.quiz { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.2rem; max-width: 900px; }
.quiz .qcount { font-size: .75em; color: var(--muted); margin-bottom: .4em; }
.quiz h3 { color: var(--text); margin-top: 0; }
.quiz .opts { display: flex; flex-direction: column; gap: .6rem; margin: 1rem 0; }
.quiz .opt { text-align: left; padding: .75rem 1rem; border-radius: 8px; border: 2px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; font-size: .9em; }
.quiz .opt:hover:not(:disabled) { border-color: var(--blue); }
.quiz .opt:disabled { cursor: default; }
.quiz .opt.right { border-color: var(--green); }
.quiz .opt.right::before { content: "✓ "; color: var(--green); font-weight: 800; }
.quiz .opt.wrong { border-color: var(--red); }
.quiz .opt.wrong::before { content: "✗ "; color: var(--red); font-weight: 800; }
.quiz .fb { min-height: 1.5em; margin-bottom: .8em; }

/* ---------- Jargon decoder ---------- */
.jargon { font-size: 1.15em; line-height: 2.1; text-align: center; margin: .6em 0; }
.chip { display: inline-block; border: 2px solid var(--blue); background: var(--code-bg); color: var(--text); border-radius: 6px; padding: 0 .45em; cursor: pointer; line-height: 1.6; font-size: 1em; }
.chip:hover { background: color-mix(in srgb, var(--blue) 25%, transparent); }
.chip.done { border-color: var(--green); cursor: default; }
.chip .m { display: block; font-size: .62em; color: var(--green); font-weight: 700; line-height: 1.3; }
.jargon-result { text-align: center; color: var(--green); font-weight: 700; min-height: 1.5em; }

/* ---------- Matching game ---------- */
.match { display: grid; grid-template-columns: minmax(8rem, 14rem) minmax(0, 1fr); gap: 1rem; margin-top: .6em; }
@media (max-width: 600px) { .match { grid-template-columns: minmax(0, 1fr); } }
.match .col { display: flex; flex-direction: column; gap: .6rem; }
.draggable { background: var(--card); border: 2px solid var(--yellow); border-radius: 8px; padding: .55rem .8rem; cursor: grab; font-weight: 700; text-align: center; touch-action: manipulation; }
.draggable.sel { outline: 3px solid var(--yellow); outline-offset: 2px; }
.draggable.used { display: none; }
.dropzone { background: var(--code-bg); border: 2px dashed var(--border); border-radius: 8px; padding: .55rem .8rem; cursor: pointer; font-size: .85em; touch-action: manipulation; }
.dropzone.over { border-color: var(--blue); }
.dropzone.correct { border: 2px solid var(--green); cursor: default; }
.dropzone.correct::before { content: "✓ "; color: var(--green); font-weight: 800; }
.dropzone.shake { animation: shake .45s; border-color: var(--red); }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.match-status { font-weight: 700; min-height: 1.5em; margin-top: .6em; grid-column: 1 / -1; }

/* ---------- Terminal simulator ---------- */
.term-sim { background: #0b0b0b; color: #e5e7eb; border: 1px solid #333; border-radius: 10px; font-family: var(--mono); font-size: .72em; height: 15em; overflow-y: auto; padding: .8rem 1rem; }
.term-sim .line { white-space: pre-wrap; word-break: break-word; }
.term-sim .echo { color: #9ca3af; }
.term-sim .in { display: flex; align-items: center; gap: .5em; }
.term-sim .pr { color: #34d399; white-space: nowrap; }
.term-sim input { flex: 1; min-width: 4em; background: transparent; border: none; color: #fff; font: inherit; outline: none; }
.term-sim input:focus-visible { outline: none; }
.term-sim:focus-within { border-color: #34d399; }

/* ---------- Git staging visualizer ---------- */
.gitviz .cols4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .7rem; }
@media (max-width: 760px) { .gitviz .cols4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.gitviz .zone { background: var(--card); border: 1px solid var(--border); border-top: 5px solid; border-radius: 8px; padding: .6rem; min-height: 9.5em; }
.gitviz .zone h4 { font-size: .72em; text-transform: uppercase; letter-spacing: .08em; margin-bottom: .4em; }
.gitviz .zone .sub { font-size: .62em; color: var(--muted); margin-bottom: .5em; }
.gitviz .z1 { border-top-color: var(--yellow); } .gitviz .z2 { border-top-color: var(--blue); }
.gitviz .z3 { border-top-color: var(--green); } .gitviz .z4 { border-top-color: var(--purple); }
.gitviz .card { font-family: var(--mono); font-size: .62em; border: 1px solid var(--border); border-radius: 6px; padding: .35em .5em; margin-bottom: .4em; background: var(--bg); animation: fade .35s; }
.gitviz .card .st { display: block; font-family: var(--font); font-size: .9em; color: var(--muted); }
.gitviz .controls { display: flex; flex-wrap: wrap; gap: .5rem; margin: .8rem 0; align-items: center; }
.gitviz .controls input { font-family: var(--mono); font-size: .7rem; padding: .35rem .5rem; border-radius: 6px; border: 1px solid var(--border); background: var(--code-bg); color: var(--text); min-width: 14em; flex: 1; }
.gitviz pre { min-height: 6em; max-height: 13em; overflow-y: auto; }

/* ---------- Undo guide ---------- */
.undo { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.2rem; }
.undo .trail { font-size: .75em; color: var(--muted); margin-bottom: .5em; }
.undo .q { font-size: 1.1em; font-weight: 800; margin-bottom: .6em; }
.undo .row { display: flex; gap: .6rem; flex-wrap: wrap; }
.undo .answer { border-left: 5px solid var(--blue); padding-left: .9rem; }

/* ---------- Flow diagram (step → step) ---------- */
.flow { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr); gap: .4rem; align-items: stretch; margin: .6em 0 .9em; }
.flow .step { background: var(--card); border: 1px solid var(--border); border-top: 5px solid var(--border); border-radius: 8px; padding: .55rem .7rem; font-size: .74em; display: flex; flex-direction: column; gap: .2em; }
.flow .step b { font-size: 1.1em; }
.flow .step em { color: var(--muted); }
.flow .s1 { border-top-color: var(--yellow); } .flow .s1 b { color: var(--yellow); }
.flow .s2 { border-top-color: var(--blue); } .flow .s2 b { color: var(--blue); }
.flow .s3 { border-top-color: var(--green); } .flow .s3 b { color: var(--green); }
.flow .s4 { border-top-color: var(--purple); } .flow .s4 b { color: var(--purple); }
.flow .arrow { display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: .66em; color: var(--muted); text-align: center; }
.flow .arrow::after { content: "\2192"; font-size: 1.8em; line-height: 1; color: var(--text); }
@media (max-width: 900px) {
  .flow { grid-template-columns: minmax(0,1fr); }
  .flow .arrow { flex-direction: row; gap: .4em; }
  .flow .arrow::after { content: "\2193"; font-size: 1.3em; }
}

[data-glossary-grid] { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: .5rem; font-size: .66em; }
[data-glossary-grid] .item { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: .45rem .7rem; }
[data-glossary-grid] .item b { color: var(--yellow); display: block; }
.glossary-grid .item b { color: var(--yellow); display: block; }

@media (max-width: 600px) {
  .slide { padding-top: 6.2rem; }
  h1 { font-size: 2em; }
  h2 { font-size: 1.45em; }
  #deck-title { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header id="topbar">
  <div class="group">
    <a class="btn link" href="../index.html" aria-label="Back to the course learning hub">← Course map</a>
    <button class="btn" id="btn-os" type="button" aria-label="Switch operating system for commands">OS: Windows</button>
    <button class="btn" id="btn-theme" type="button" aria-label="Switch light or dark theme">Theme</button>
    <span id="deck-title"></span>
  </div>
  <div class="group">
    <button class="btn" id="btn-overview" type="button" title="Overview (O)">Slides (O)</button>
    <button class="btn" id="btn-notes" type="button" title="Speaker notes (N)" aria-controls="drawer-notes">Notes (N)</button>
    <button class="btn" id="btn-glossary" type="button" title="Glossary (G)" aria-controls="drawer-glossary">Glossary (G)</button>
  </div>
</header>

<main id="deck" aria-live="polite"></main>

<nav id="navbtns" aria-label="Slide navigation">
  <button class="btn" id="btn-prev" type="button" aria-label="Previous slide">&larr;</button>
  <button class="btn" id="btn-next" type="button" aria-label="Next slide">&rarr;</button>
</nav>
<div id="counter"></div>
<div id="progress"><div></div></div>

<aside id="drawer-notes" class="drawer" role="dialog" aria-label="Speaker notes" aria-hidden="true">
  <button class="btn close" type="button" data-close="drawer-notes" aria-label="Close notes">X</button>
  <h2>Speaker Notes</h2>
  <div id="notes-body"></div>
</aside>
<aside id="drawer-glossary" class="drawer" role="dialog" aria-label="Glossary" aria-hidden="true">
  <button class="btn close" type="button" data-close="drawer-glossary" aria-label="Close glossary">X</button>
  <h2>Career Companion Glossary</h2>
  <p id="gloss-count"></p>
  <div id="gloss-body"></div>
</aside>

<script>
/* Course glossary: every "career companion" term, defined once.
   Definitions come from the vocabulary tables in README.md,
   resources/command-line-basics.md, and resources/git-commands.md.
   Each weekNN.js lists the ids it reviews and the ids it introduces.
   Rules: write a literal backslash as \\ ; escape < as &lt; ; no em dashes. */
window.GLOSSARY = [
    { id: "editor", term: "Editor / IDE", say: "ED-ih-ter, I-D-E",
      meaning: "The program where you write, edit, and save code. An IDE (Integrated Development Environment) bundles an editor with tools to run and inspect your code.",
      usage: "Which editor are you using for this project?" },
    { id: "terminal", term: "Terminal", say: "TER-mih-nul",
      meaning: "The window you type into.",
      usage: "Open a terminal and run the script." },
    { id: "shell", term: "Shell", say: "shell",
      meaning: "The program inside that window that reads your commands and runs them.",
      origin: "the outer layer wrapped around the operating system's core. Bash is a programmer pun: Bourne Again SHell.",
      usage: "Which shell are you in, PowerShell or zsh?" },
    { id: "prompt", term: "Prompt", say: "prompt",
      meaning: "The text waiting at the start of the line, telling you the shell is ready.",
      usage: "Read your prompt. Are you in the right folder?" },
    { id: "commandline", term: "Command line", say: "kuh-MAND line",

        var cmd = "$ git commit -m \"" + msg + "\"\n";
        if (!msg) { out(cmd + "Aborting commit due to empty commit message."); return; }
        if (!staged.length) { out(cmd + status()); return; }
        var id = hex(), created = staged.filter(function (x) { return x.staged === "new file"; });
        state.local.push({ id: id, msg: msg });
        staged.forEach(function (x) { x.tracked = true; x.staged = null; });
        draw();
        out(cmd + "[main " + id + "] " + msg + "\n " + staged.length + " file" + (staged.length > 1 ? "s" : "") + " changed, 1 insertion(+)" + created.map(function (x) { return "\n create mode 100644 " + x.name; }).join(""));
      },
      push: function () {
        if (!state.local.length) { out("$ git push\nEverything up-to-date"); return; }
        var from = state.remote[state.remote.length - 1].id, to = state.local[state.local.length - 1].id;
        state.remote = state.remote.concat(state.local); state.local = []; draw();
        out("$ git push\nTo https://github.com/YOUR-USERNAME/python-fall26-code-alongs.git\n   " + from + ".." + to + "  main -> main");
      },
      reset: reset
    };
    $all("[data-a]", box).forEach(function (b) { b.addEventListener("click", function () { actions[b.getAttribute("data-a")](); }); });
    reset();
  });

  /* ---------- Undo guide ---------- */
  $all("[data-undo]").forEach(function (box) {
    var T = D.undo[box.getAttribute("data-undo")];
    box.className += " undo";
    function go(id, trail) {
      var n = T[id];
      if (n.q) {
        box.innerHTML = '<div class="trail">' + (trail.length ? trail.join(" \u2192 ") : "Start here") + '</div><div class="q">' + n.q + '</div><div class="row"><button type="button" class="btn" data-go="no">No</button><button type="button" class="btn" data-go="yes">Yes</button></div>';
        $('[data-go="no"]', box).addEventListener("click", function () { go(n.no, trail.concat([n.short + " No"])); });
        $('[data-go="yes"]', box).addEventListener("click", function () { go(n.yes, trail.concat([n.short + " Yes"])); });
      } else {
        box.innerHTML = '<div class="trail">' + trail.join(" \u2192 ") + '</div><div class="answer"><div class="q"><code>' + n.cmd + '</code></div><p>' + n.what + '</p></div><button type="button" class="btn" data-go="restart">Start over</button>';
        $('[data-go="restart"]', box).addEventListener("click", function () { go("start", []); });
      }
    }
    go("start", []);
  });

  /* ---------- Start ---------- */
  function fromHash() { var n = parseInt((location.hash || "").replace("#", ""), 10); return isNaN(n) ? 0 : n - 1; }
  window.addEventListener("hashchange", function () { var t = fromHash(); if (t !== current) show(t); });
  show(fromHash());
})();
</script>
